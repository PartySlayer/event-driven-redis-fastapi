networks:
  app-network:
    driver: bridge

services:

  backend:
    build: ./backend
    networks:
      - app-network
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      - cache

  cache:
    image: redis:latest
    networks:
      - app-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: ["redis-server"]
    #volumes:

  frontend:
    build: ./frontend  
    networks:
      - app-network
    ports:
      - "3000:80"
    depends_on:
      - backend


#volumes:
